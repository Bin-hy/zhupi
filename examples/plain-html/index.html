<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotation SDK Demo</title>
    <style>
      body {
        margin: 0;
        padding: 48px 24px 120px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.8;
        color: #1f2328;
        background: #fff;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 24px;
      }
      p {
        margin: 18px 0;
      }
      code {
        background: #f3f4f6;
        padding: 2px 5px;
        border-radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e6e6e6;
          background: #16181d;
        }
        code {
          background: #1e2127;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Annotation SDK Demo</h1>
      <p>
        这是第一段可划线的正文。用鼠标选中任意一段文字，点击浮出的「批注」按钮，写下你的解释或疑问。
        发布后刷新页面，高亮应当仍然存在；修改正文一两个字后也应当能够重新定位。
      </p>
      <p>
        第二段用于测试多批注与回复。每条批注都可以被独立标记为已解决，作者可以删除自己的批注，
        站点管理员可以在管理 API 中审核或隐藏内容。
      </p>
      <p>
        该示例通过 <code>?siteKey=</code> 选择站点，通过 <code>?api=</code> 指定服务地址。
        打开右下角「批注」后，可在「账号」中切换主题/语言、管理登录设备；顶部标签可筛选
        全部 / 我的 / 已解决 / 待审。
      </p>
    </main>

    <script>
      const params = new URLSearchParams(location.search)
      const apiBase = (params.get('api') || 'http://127.0.0.1:18090').replace(/\/+$/, '')
      const siteKey = params.get('siteKey') || 'REPLACE_WITH_SITE_KEY'

      const script = document.createElement('script')
      script.src = apiBase + '/sdk/v1/zhupi.js'
      script.onload = function () {
        window.annotationDemo = ZhupiSDK.init({
          siteKey: siteKey,
          apiBase: apiBase,
          devLogin: true,
          selectRoot: 'main',
          on: {
            ready: function () {
              console.log('[demo] annotation sdk ready')
            },
            error: function (err) {
              console.error('[demo] annotation sdk error', err)
            },
          },
        })
      }
      document.head.appendChild(script)
    </script>
  </body>
</html>
