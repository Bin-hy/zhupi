services:
  zhupi:
    # 默认使用 GHCR 已发布镜像；本地构建用 docker compose up -d --build
    # 可用 ZHUPI_TAG 覆盖 tag，例如 ZHUPI_TAG=edge
    image: ghcr.io/bin-hy/zhupi:${ZHUPI_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ADDR: ":8080"
      DB_PATH: /data/zhupi.db
      # 前面有反向代理（Caddy/Nginx），用于识别真实客户端 IP
      TRUST_PROXY: "1"
    # 只监听宿主机回环地址，由 Caddy/Nginx 对外提供 HTTPS
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - zhupi-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  zhupi-data:
    name: zhupi-data
