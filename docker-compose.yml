services:
  annotation:
    build: .
    image: gocampus/annotation-service:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ADDR: ":8080"
      DB_PATH: /data/annotations.db
      # 前面有反向代理（Caddy/Nginx），用于识别真实客户端 IP
      TRUST_PROXY: "1"
    # 只监听宿主机回环地址，由 Caddy/Nginx 对外提供 HTTPS
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - annot-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  annot-data:
    name: gocampus-annot-data
